<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 1000"
  width="800"
  height="1000"
  fill="none"
  role="img"
  aria-label="Ilustrasi keranjang bambu berisi dimsum"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdf6ec" />
      <stop offset="0.55" stop-color="#f7e3c4" />
      <stop offset="1" stop-color="#eec89a" />
    </linearGradient>

    <linearGradient id="basket" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d9a86a" />
      <stop offset="1" stop-color="#bd8748" />
    </linearGradient>

    <radialGradient id="dumpling" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f0dcbd" />
    </radialGradient>

    <g id="bun">
      <ellipse cx="0" cy="0" rx="58" ry="50" fill="url(#dumpling)" />
      <path
        d="M-40 -14 q14 -20 40 -20 q26 0 40 20"
        stroke="#dcc094"
        stroke-width="3"
        stroke-linecap="round"
      />
      <path
        d="M-22 -30 q22 -14 44 0"
        stroke="#dcc094"
        stroke-width="3"
        stroke-linecap="round"
      />
      <circle cx="0" cy="-2" r="9" fill="#e8b13f" />
    </g>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)" />

  <!-- Uap -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.5">
    <path d="M300 250 q-34 -52 0 -104 q34 -52 0 -104" />
    <path d="M400 218 q-34 -58 0 -116 q34 -58 0 -116" />
    <path d="M500 250 q-34 -52 0 -104 q34 -52 0 -104" />
  </g>

  <!-- Keranjang bambu, dilihat dari atas -->
  <circle cx="400" cy="560" r="286" fill="url(#basket)" />
  <circle cx="400" cy="560" r="286" fill="none" stroke="#a9743a" stroke-width="6" />
  <circle cx="400" cy="560" r="252" fill="#f6ecdb" />

  <!-- Anyaman bambu -->
  <g stroke="#e2cfae" stroke-width="5" stroke-linecap="round">
    <path d="M186 470 h428" />
    <path d="M170 520 h460" />
    <path d="M166 570 h468" />
    <path d="M170 620 h460" />
    <path d="M186 670 h428" />
  </g>
  <circle cx="400" cy="560" r="252" fill="none" stroke="#c9a066" stroke-width="8" />

  <!-- Dimsum -->
  <use href="#bun" x="400" y="430" />
  <use href="#bun" x="288" y="512" />
  <use href="#bun" x="512" y="512" />
  <use href="#bun" x="330" y="642" />
  <use href="#bun" x="470" y="642" />
  <use href="#bun" x="400" y="560" />

  <!-- Sumpit -->
  <g stroke="#8c5a2b" stroke-width="13" stroke-linecap="round" opacity="0.85">
    <path d="M96 938 L332 872" />
    <path d="M104 976 L340 910" />
  </g>
</svg>
